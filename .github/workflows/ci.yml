name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        timeout-minutes: 5
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Test automatic release policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --locked
      - name: Test
        run: cargo +stable test --workspace --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked
      - name: Verify package
        run: cargo +stable package --locked -p apple-password-gen
