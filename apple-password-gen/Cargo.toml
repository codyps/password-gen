[package]
name = "apple-password-gen"
version = "1.0.0"
edition = "2021"
description = "Generate passwords in the format used by Apple's Strong Password Suggestion"
license = "MPL-2.0"
repository = "https://github.com/codyps/password-gen"
documentation = "https://docs.rs/apple-password-gen"

[dependencies]
rand = "0.10.2"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
